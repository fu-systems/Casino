name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Godot cross-exports Windows binaries from Linux, so every job runs on
# ubuntu-latest with the same editor build and export templates.
env:
  GODOT_VERSION: "4.5.1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: |
          set -uo pipefail
          godot --headless --import --path . >/tmp/import.log 2>&1 || true
          tail -n 40 /tmp/import.log

      - name: Fail on import errors
        run: .github/scripts/assert-no-godot-errors.sh /tmp/import.log "importing the project"

      - name: Boot the game headless
        run: |
          set -uo pipefail
          godot --headless --path . --quit-after 300 >/tmp/run.log 2>&1 || true
          tail -n 40 /tmp/run.log

      - name: Fail on runtime errors
        run: .github/scripts/assert-no-godot-errors.sh /tmp/run.log "booting the game"

      - name: Run the rule suites
        run: |
          set -uo pipefail
          # The suites drive the real scenes, so they catch rule regressions
          # that a parse check never would.
          godot --headless --path . res://tests/run_all.tscn 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Rule suites failed"
            exit "$status"
          fi

      # A script error inside a suite can stop a check from running at all
      # without failing one, so the log is scanned as well as the exit code.
      - name: Fail on errors during the suites
        run: .github/scripts/assert-no-godot-errors.sh /tmp/tests.log "running the rule suites"

  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux
            binary: Casino.x86_64
            artifact: casino-linux-x86_64
            readme: true
          - name: Windows
            preset: Windows
            binary: Casino.exe
            artifact: casino-windows-x86_64
            readme: true
          # The Steam edition: the same game with the `steam` feature, which
          # includes every pack and drops the tip jar. Its depots hold only
          # the game, and it never goes into the GitHub release.
          - name: Steam Linux
            preset: Steam Linux
            binary: Casino.x86_64
            artifact: casino-steam-linux
            readme: false
          - name: Steam Windows
            preset: Steam Windows
            binary: Casino.exe
            artifact: casino-steam-windows
            readme: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --import --path . >/tmp/import.log 2>&1 || true

      - name: Export ${{ matrix.name }}
        run: |
          set -euo pipefail
          out="$PWD/build/${{ matrix.artifact }}"
          mkdir -p "$out"
          godot --headless --path . \
            --export-release "${{ matrix.preset }}" \
            "$out/${{ matrix.binary }}" >/tmp/export.log 2>&1 || true
          tail -n 20 /tmp/export.log

          if [ ! -s "$out/${{ matrix.binary }}" ]; then
            echo "::error::Export produced no binary for preset '${{ matrix.preset }}'"
            cat /tmp/export.log
            exit 1
          fi
          chmod +x "$out/${{ matrix.binary }}"
          ls -lh "$out"

      - name: Fail on export errors
        run: .github/scripts/assert-no-godot-errors.sh /tmp/export.log "exporting ${{ matrix.name }}"

      - name: Include README with the build
        if: matrix.readme
        run: cp README.md "build/${{ matrix.artifact }}/README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/
          if-no-files-found: error

  export-android:
    name: Export Android
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # Godot 4.2+ builds Android against JDK 17, and needs keytool on PATH
      # to create the debug keystore it signs with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the Android SDK has what Godot needs
        run: |
          set -euo pipefail
          echo "SDK root: ${ANDROID_SDK_ROOT:-unset}"
          ls "$ANDROID_SDK_ROOT/platform-tools/adb" >/dev/null 2>&1 \
            || yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools"
          # Godot signs with apksigner, which lives in any build-tools release.
          if ! ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner >/dev/null 2>&1; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          fi
          ls "$ANDROID_SDK_ROOT"/build-tools/

      - name: Point Godot at the Android SDK
        env:
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          # Godot reads the SDK location from Editor Settings, not the
          # environment. Generating the file first means we only rewrite two
          # keys instead of hand-authoring the whole resource.
          godot --headless --editor --quit --path . >/dev/null 2>&1 || true
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          if [ ! -f "$settings" ]; then
            echo "::error::No editor settings at $settings"
            ls -la "$HOME/.config/godot" || true
            exit 1
          fi
          # Drop any existing values and re-add ours. [resource] is the last
          # section in the file, so appending stays inside it.
          sed -i -e '/^export\/android\/android_sdk_path/d' \
                 -e '/^export\/android\/java_sdk_path/d' "$settings"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" >> "$settings"
          grep -E '^export/android/' "$settings"

      - name: Export Android
        run: |
          set -euo pipefail
          out="$PWD/build/casino-android"
          mkdir -p "$out"
          # Debug-signed: a release APK needs a real keystore in secrets.
          godot --headless --path . \
            --export-debug "Android" "$out/Casino.apk" >/tmp/export.log 2>&1 || true
          tail -n 20 /tmp/export.log

          if [ ! -s "$out/Casino.apk" ]; then
            echo "::error::Android export produced no APK"
            cat /tmp/export.log
            exit 1
          fi
          # An APK is a zip; check it carries the pieces that make it one.
          unzip -l "$out/Casino.apk" | grep -qE 'AndroidManifest\.xml' \
            || { echo "::error::APK has no AndroidManifest.xml"; exit 1; }
          unzip -l "$out/Casino.apk" | grep -qE 'classes\.dex' \
            || { echo "::error::APK has no classes.dex"; exit 1; }
          ls -lh "$out"

      - name: Fail on export errors
        run: .github/scripts/assert-no-godot-errors.sh /tmp/export.log "exporting Android"

      - name: Include README with the build
        run: cp README.md build/casino-android/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: casino-android
          path: build/casino-android/
          if-no-files-found: error

  # The Play Store build: a release-signed Android App Bundle with Google Play
  # Billing, made only for version tags (or by hand), since it needs the upload
  # keystore from repo secrets. The everyday debug APK above stays a plain,
  # non-Gradle export so ordinary pushes never depend on any of this.
  export-play:
    name: Export Android (Play)
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      # Pinned to the release built against this project's Godot version.
      BILLING_PLUGIN_VERSION: "3.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the upload keystore is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (see docs/PLAY_RELEASE.md)"
            exit 1
          fi

      - name: Make sure the Android SDK has the Gradle build's platform
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          yes | "$sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          ls "$ANDROID_SDK_ROOT"/platforms/ "$ANDROID_SDK_ROOT"/build-tools/

      - name: Fetch the Google Play Billing plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/billing addons
          gh release download "$BILLING_PLUGIN_VERSION" \
            --repo godot-sdk-integrations/godot-google-play-billing \
            --pattern '*.zip' --dir /tmp/billing
          unzip -q -o /tmp/billing/*.zip -d /tmp/billing/unpacked
          # The zip's top-level layout has varied between releases, so find
          # the plugin by its manifest rather than assuming a path.
          cfg="$(find /tmp/billing/unpacked -path '*GodotGooglePlayBilling/plugin.cfg' | head -n1)"
          if [ -z "$cfg" ]; then
            echo "::error::No GodotGooglePlayBilling/plugin.cfg in the $BILLING_PLUGIN_VERSION release"
            find /tmp/billing/unpacked | head -50
            exit 1
          fi
          rm -rf addons/GodotGooglePlayBilling
          cp -r "$(dirname "$cfg")" addons/GodotGooglePlayBilling
          ls -R addons/GodotGooglePlayBilling
          # Enabled only for this build; the committed project leaves it off so
          # desktop exports and the debug APK never try to load it.
          printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/GodotGooglePlayBilling/plugin.cfg")\n' >> project.godot

      - name: Point Godot at the Android SDK
        env:
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          godot --headless --editor --quit --path . >/dev/null 2>&1 || true
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          sed -i -e '/^export\/android\/android_sdk_path/d' \
                 -e '/^export\/android\/java_sdk_path/d' "$settings"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" >> "$settings"

      - name: Stamp the version
        run: |
          set -euo pipefail
          # Play rejects a reused version code, so the run number supplies a
          # fresh one; the name comes from the tag when there is one.
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) name="0.0.${GITHUB_RUN_NUMBER}" ;; esac
          sed -i -e "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" \
                 -e "s/^version\/name=.*/version\/name=\"${name}\"/" export_presets.cfg
          sed -i -e "s/^config\/version=.*/config\/version=\"${name}\"/" project.godot
          grep -E '^version/' export_presets.cfg

      - name: Export the signed App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$keystore"

          out="$PWD/build/casino-android-play"
          mkdir -p "$out"
          godot --headless --import --path . >/dev/null 2>&1 || true
          godot --headless --path . --install-android-build-template \
            --export-release "Android Play" "$out/Casino.aab" >/tmp/export.log 2>&1 || true
          rm -f "$keystore"
          tail -n 40 /tmp/export.log

          if [ ! -s "$out/Casino.aab" ]; then
            echo "::error::Play export produced no App Bundle"
            cat /tmp/export.log
            exit 1
          fi
          unzip -l "$out/Casino.aab" | grep -q 'base/manifest/AndroidManifest.xml' \
            || { echo "::error::The bundle has no base/manifest/AndroidManifest.xml"; exit 1; }
          ls -lh "$out"

      - name: Fail on export errors
        run: .github/scripts/assert-no-godot-errors.sh /tmp/export.log "exporting the Play bundle"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: casino-android-play
          path: build/casino-android-play/
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [export, export-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package builds
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the free builds. The download takes every artifact the run
          # has made so far, which can include the Play bundle and the Steam
          # depots; those go to their stores, not here.
          for name in casino-linux-x86_64 casino-windows-x86_64 casino-android; do
            dir="artifacts/${name}"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing build artifact ${name}"
              exit 1
            fi
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/${name}.zip" .)
            echo "packaged ${name}.zip"
          done
          ls -lh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "Casino ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip
